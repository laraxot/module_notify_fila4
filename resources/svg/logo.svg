ia-label="Notification System Logo">    <style>        .notify-bell {             animation: bell-ring 4s ease-in-out infinite;            transform-origin: 12px 4px;        }        .notify-waves {             animation: notification-wave 2s ease-in-out infinite;        }        .notify-indicator {             animation: pulse-alert 1.5s ease-in-out infinite;            transform-origin: 18px 6px;        }        .notify-sound {             animation: sound-ripple 3s ease-in-out infinite;        }                @keyframes bell-ring {            0%, 90%, 100% { transform: rotate(0deg); }            5% { transform: rotate(5deg); }            10% { transform: rotate(-5deg); }            15% { transform: rotate(3deg); }            20% { transform: rotate(-3deg); }            25% { transform: rotate(0deg); }        }                @keyframes notification-wave {            0% { opacity: 0.3; transform: scale(0.8); }            50% { opacity: 0.7; transform: scale(1.1); }            100% { opacity: 0.3; transform: scale(0.8); }        }                @keyframes pulse-alert {            0%, 100% { opacity: 0.8; transform: scale(1); }            50% { opacity: 1; transform: scale(1.2); }        }                @keyframes sound-ripple {            0% { opacity: 0.2; transform: scale(0.9); }            50% { opacity: 0.6; transform: scale(1.3); }            100% { opacity: 0.2; transform: scale(0.9); }        }                svg:hover .notify-bell {             animation-duration: 1s;         }        svg:hover .notify-waves {             animation-duration: 1s;         }        svg:hover .notify-indicator {             animation-duration: 0.8s;         }                @media (prefers-color-scheme: dark) {            .notify-bell { opacity: 0.95; }            .notify-waves { opacity: 0.8; }            .notify-indicator { opacity: 0.9; }            .notify-sound { opacity: 0.7; }        }                @media (prefers-reduced-motion: reduce) {            .notify-bell, .notify-waves, .notify-indicator, .notify-sound { animation: none; }        }    </style>        <!-- Bell body -->    <path class="notify-bell"           stroke-linecap="round"           stroke-linejoin="round"           d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />        <!-- Notification indicator -->    <circle class="notify-indicator" cx="18" cy="6" r="3" fill="currentColor" opacity="0.8" />        <!-- Sound waves -->    <g class="notify-sound">        <path stroke-linecap="round" stroke-linejoin="round"               d="M19 11c0-1.5-1-3-2.5-3" stroke-width="1" opacity="0.5" />        <path stroke-linecap="round" stroke-linejoin="round"               d="M21 9c0-2.5-2-5-4.5-5" stroke-width="1" opacity="0.3" />    </g>        <!-- Notification waves -->    <g class="notify-waves">        <circle cx="12" cy="12" r="8" stroke-width="0.5" opacity="0.3" stroke-dasharray="3 6" />        <circle cx="12" cy="12" r="12" stroke-width="0.5" opacity="0.2" stroke-dasharray="4 8" />    </g>==============>>>>>>> a612126 (.)=======>>>>>>> 467a2e4 (.)=======<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>>>>>>>> 518c702 (.)>>>>>>> bd22fd4 (.)=======>>>>>>> f2a81bf (.)=======>>>>>>> a612126 (.)=======>>>>>>> 1309d05 (.)=======>>>>>>> 467a2e4 (.)=======>>>>>>> 038df52 (.)</svg>>>>>>>> b19cd40 (.)>>>>>>> 82ae73b (.)>>>>>>> 2fc60436 (.)============================>>>>>>> 503981fd (.)==============>>>>>>> 7a2f131f (.)=======>>>>>>> bd804d67 (.)=======>>>>>>> bd804d67 (.)=======>>>>>>> c434001 (.)>>>>>>> dceba960 (.)=======>>>>>>> 10b3b08 (.)==============>>>>>>> 5dacc15 (.)==============>>>>>>> cde5a49 (.)>>>>>>> a12f125f4a (.)>>>>>>> d09cb759 (.)=======>>>>>>> 011072e4 (.)=